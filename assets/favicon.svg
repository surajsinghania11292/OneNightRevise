<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep obsidian-forest luxury backdrop -->
    <linearGradient id="onrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261C"/>
      <stop offset="55%" stop-color="#0D1912"/>
      <stop offset="100%" stop-color="#070E0A"/>
    </linearGradient>

    <!-- Luxury Champagne to Warm Liquid Gold -->
    <linearGradient id="onrGold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C26A04"/>
    </linearGradient>

    <!-- Radiant Emerald Clarity Spark -->
    <linearGradient id="onrEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="45%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Fine Hairline Golden Rim -->
    <linearGradient id="onrRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas with Golden Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#onrBg)" stroke="url(#onrRim)" stroke-width="1.3"/>

  <!-- Subtle Harmonic Orbit Guide (Engineering Geometry) -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FDE68A" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="2 3"/>

  <!-- Precision Aerodynamic Crescent Moon (OneNight) -->
  <path d="M 34 13 C 22 13 13.5 21.5 13.5 32 C 13.5 42.5 22 51 34 51 C 23.5 47 18 39.5 18 32 C 18 24.5 23.5 17 34 13 Z" fill="url(#onrGold)"/>

  <!-- 4-Point Nocturnal Focus Spark (Revise Insight) -->
  <path d="M 40 22.5 Q 40 32 49.5 32 Q 40 32 40 41.5 Q 40 32 30.5 32 Q 40 32 40 22.5 Z" fill="url(#onrEmerald)"/>

  <!-- Precision Micro-Nodes (Distributed Synapses) -->
  <circle cx="43.5" cy="18" r="1.8" fill="#FDE68A" opacity="0.85"/>
  <circle cx="45" cy="44.5" r="1.5" fill="#34D399" opacity="0.75"/>
</svg>
