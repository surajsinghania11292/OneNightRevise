<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep midnight obsidian-pine backdrop -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261D"/>
      <stop offset="50%" stop-color="#0C1812"/>
      <stop offset="100%" stop-color="#050B08"/>
    </linearGradient>

    <!-- Warm antique gold and pine hairline rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B854" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#2E7D55" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E5B854" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Facet Gradients: Forest Pine, Luminous Jade & Deep Obsidian with Sunlit Amber Crown -->
    <linearGradient id="goldCrownFacet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="jadeTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B278"/>
      <stop offset="100%" stop-color="#1C6944"/>
    </linearGradient>

    <linearGradient id="midLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#268254"/>
      <stop offset="100%" stop-color="#124A2F"/>
    </linearGradient>

    <linearGradient id="botLeftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14472E"/>
      <stop offset="100%" stop-color="#0A2819"/>
    </linearGradient>

    <linearGradient id="botTipLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3723"/>
      <stop offset="100%" stop-color="#06170E"/>
    </linearGradient>

    <linearGradient id="topRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA068"/>
      <stop offset="50%" stop-color="#1B6842"/>
      <stop offset="100%" stop-color="#104229"/>
    </linearGradient>

    <linearGradient id="botRightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#175336"/>
      <stop offset="100%" stop-color="#0C2F1E"/>
    </linearGradient>

    <linearGradient id="botTipRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2618"/>
      <stop offset="100%" stop-color="#04100A"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Midnight Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="1.3"/>

  <!-- Precision-Carved Obsidian Crystal Gemstone -->
  <g id="obsidian-crystal">
    <!-- Facet A: Top Crown Crest (Sunlit Golden Amber Reflection) -->
    <polygon points="30,9 47,20 31,23" fill="url(#goldCrownFacet)"/>
    
    <!-- Facet B: Top Left Facet (Radiant Jade) -->
    <polygon points="30,9 31,23 17,18" fill="url(#jadeTopLeft)"/>
    
    <!-- Facet C: Mid-Left Front Face (Forest Pine) -->
    <polygon points="17,18 31,23 33,35 12,31" fill="url(#midLeftFacet)"/>
    
    <!-- Facet D: Lower Left Shard (Deep Pine Shadow) -->
    <polygon points="12,31 33,35 31,46 18,47" fill="url(#botLeftFacet)"/>
    
    <!-- Facet E: Bottom Left Tip (Obsidian Base) -->
    <polygon points="18,47 31,46 32,55" fill="url(#botTipLeft)"/>
    
    <!-- Facet F: Upper Right Face (Emerald Facet) -->
    <polygon points="47,20 53,33 33,35 31,23" fill="url(#topRightFacet)"/>
    
    <!-- Facet G: Lower Right Face (Shadow Emerald) -->
    <polygon points="53,33 44,49 31,46 33,35" fill="url(#botRightFacet)"/>
    
    <!-- Facet H: Bottom Right Tip (Deep Midnight Obsidian) -->
    <polygon points="44,49 32,55 31,46" fill="url(#botTipRight)"/>

    <!-- Internal Facet Seam Hairlines (3D Crystal Depth) -->
    <polyline points="30,9 31,23 33,35 31,46 32,55" fill="none" stroke="#FDE68A" stroke-width="0.75" stroke-opacity="0.5"/>
    <line x1="31" y1="23" x2="17" y2="18" stroke="#FDE68A" stroke-width="0.6" stroke-opacity="0.45"/>
    <line x1="31" y1="23" x2="47" y2="20" stroke="#FDE68A" stroke-width="0.6" stroke-opacity="0.45"/>
    <line x1="33" y1="35" x2="12" y2="31" stroke="#38B278" stroke-width="0.6" stroke-opacity="0.35"/>
    <line x1="33" y1="35" x2="53" y2="33" stroke="#38B278" stroke-width="0.6" stroke-opacity="0.35"/>
    <line x1="31" y1="46" x2="18" y2="47" stroke="#1C6944" stroke-width="0.6" stroke-opacity="0.45"/>
    <line x1="31" y1="46" x2="44" y2="49" stroke="#1C6944" stroke-width="0.6" stroke-opacity="0.45"/>

    <!-- Nocturnal Clarity Core Spark on Crown Vertex -->
    <circle cx="31" cy="23" r="1.3" fill="#FFFDF2" opacity="0.95"/>
    <circle cx="30" cy="9" r="0.9" fill="#FDE68A" opacity="0.9"/>
  </g>
</svg>